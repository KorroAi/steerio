name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run tests
        # Les tests utilisent hf-internal-testing/tiny-random-gpt2 (téléchargé au
        # premier run) : les poids réels ne sont ni téléchargés ni committés.
        run: pytest tests/ -q
