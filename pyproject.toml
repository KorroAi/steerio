[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steerio"
version = "1.0.0"
description = "steerio — play a language model like a musical instrument via steering vectors (RepE + CAA)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "numpy",
]

[project.scripts]
steerio = "steerio.cli:main"

[tool.setuptools.packages.find]
include = ["steerio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
